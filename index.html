<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Side Talk</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f172a;
  color:#fff;
}
header{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
  background:#020617;
}
header img{
  height:42px;
  cursor:pointer;
}
header h1{
  font-size:20px;
  margin:0;
}
.main{
  padding:15px;
}
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}
.card{
  background:#1e293b;
  padding:25px;
  border-radius:12px;
  cursor:pointer;
  transition:.2s;
}
.card:hover{
  background:#334155;
}
.hidden{display:none;}
.banner-ad{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#020617;
  text-align:center;
  padding:10px;
  border-top:1px solid #334155;
}
</style>
</head>
<body>

<header>
  <img src="https://i.ibb.co/fVbJFkNx/large.png" id="appLogo">
  <h1>Side Talk</h1>
</header>

<!-- HOME PAGE -->
<div class="main" id="home">
  <div class="cards">
    <div class="card" onclick="goTo('index2.html#general')">
      <h3>General Anonymous Chat</h3>
      <p>Up to 5000 users</p>
    </div>

    <div class="card" onclick="goTo('index2.html#free')">
      <h3>Free Chats</h3>
      <p>Join public rooms</p>
    </div>

    <div class="card" onclick="goTo('index2.html#room')">
      <h3>Create / Join Room</h3>
      <p>Private anonymous rooms</p>
    </div>

    <div class="card" onclick="goTo('index3.html')">
      <h3>Report / Safety</h3>
      <p>Report abuse</p>
    </div>
  </div>
</div>

<div class="banner-ad" id="bannerAd">Sponsored Ad</div>

<script>
/* NAVIGATION */
function goTo(file){
  window.location.href = file;
}

/* ADMIN BACKDOOR */
let tapCount = 0;
document.getElementById("appLogo").addEventListener("click", ()=>{
  tapCount++;
  if(tapCount === 20){
    tapCount = 0;
    const pass = prompt("Enter Admin Password");
    if(pass === "Akinpepe100"){
      window.location.href = "admin.html";
    } else {
      alert("Wrong password");
    }
  }
});

/* ROTATING BANNER ADS */
const ads = ["Advertise here","Your brand here","Sponsored"];
let adIndex = 0;
setInterval(()=>{
  adIndex = (adIndex+1)%ads.length;
  document.getElementById("bannerAd").innerText = ads[adIndex];
},30000);
</script>

</body>
</html>
